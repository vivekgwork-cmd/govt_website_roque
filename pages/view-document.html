<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer | District Training Institute, Shimoga</title>
<link rel="icon" href="../assets/new-kar-govt-logo.jpeg">
<link rel="stylesheet" href="../css/style.css?v=3">
</head>
<body>

<header id="site-header"></header>

<div class="viewer-toolbar">
  <div class="viewer-toolbar-inner">
    <a class="btn btn-ghost btn-sm" id="back-link" href="training-material.html">&larr; Back</a>
    <h1 id="doc-title">Loading document&hellip;</h1>
    <div class="viewer-parts" id="viewer-parts"></div>
  </div>
</div>

<main class="viewer-stage" id="viewer-stage">
  <p class="viewer-status">Loading document&hellip;</p>
</main>

<footer id="site-footer"></footer>

<script src="../js/script.js?v=3"></script>
<script>
  renderHeader("../", "training");
  renderFooter("../");

  // ?title=...&file=<path from site root>[&file=...]
  // PDFs open in the browser's own viewer; Word/PowerPoint files are rendered by
  // Microsoft's Office Online viewer, which needs the site to be publicly reachable.
  const params = new URLSearchParams(location.search);
  const files = params.getAll("file").filter(f => f && !f.includes(".."));
  const title = params.get("title") || "Document";

  const titleEl = document.getElementById("doc-title");
  const stage = document.getElementById("viewer-stage");
  const partsEl = document.getElementById("viewer-parts");

  // Return to wherever the learner came from (Training Material or Administrative Statistics).
  const backLink = document.getElementById("back-link");
  if (document.referrer && new URL(document.referrer).origin === location.origin) {
    backLink.href = document.referrer;
    backLink.addEventListener("click", (e) => { e.preventDefault(); history.back(); });
  }

  function showStatus(text) {
    stage.innerHTML = "";
    const p = document.createElement("p");
    p.className = "viewer-status";
    p.textContent = text;
    stage.appendChild(p);
  }

  function show(index) {
    const file = files[index];
    const url = new URL("../" + file.split("/").map(encodeURIComponent).join("/"), location.href).href;
    const isPdf = /\.pdf$/i.test(file);
    const isLocal = !/^https?:$/.test(location.protocol) || /^(localhost|127\.|\[::1\])/.test(location.hostname);

    partsEl.querySelectorAll("button").forEach((b, i) => {
      b.classList.toggle("active", i === index);
      b.setAttribute("aria-pressed", String(i === index));
    });

    if (!isPdf && isLocal) {
      showStatus("Word and PowerPoint files can only be previewed on the published website.");
      return;
    }
    const frame = document.createElement("iframe");
    frame.title = `${title} — part ${index + 1}`;
    frame.src = isPdf
      ? url + "#toolbar=0"
      : "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url);
    stage.innerHTML = "";
    stage.appendChild(frame);
  }

  titleEl.textContent = title;
  document.title = title + " | District Training Institute, Shimoga";

  if (!files.length) {
    titleEl.textContent = "Document not found";
    showStatus("The requested document could not be found.");
  } else {
    if (files.length > 1) {
      files.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Part " + (i + 1);
        btn.addEventListener("click", () => show(i));
        partsEl.appendChild(btn);
      });
    }
    show(0);
  }
</script>
</body>
</html>
