<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer | District Training Institute, Shimoga</title>
<link rel="icon" href="../assets/new-kar-govt-logo.jpeg">
<link rel="stylesheet" href="../css/style.css?v=2">
<style>
  .viewer-toolbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--maroon);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 18px;
    flex-wrap: wrap;
  }
  .viewer-toolbar h2 { margin: 0; font-size: 1rem; }
  .viewer-parts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .viewer-parts button {
    background: var(--gold);
    color: var(--maroon-dark);
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .viewer-parts button:hover, .viewer-parts button.active { background: #fff; }

  .viewer-stage {
    background: #4a3a2c;
    padding: 16px 12px 40px;
  }
  .viewer-stage iframe {
    display: block;
    width: 100%;
    max-width: 1100px;
    height: calc(100vh - 170px);
    min-height: 480px;
    margin: 0 auto;
    border: none;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .viewer-status {
    color: #f2e6cf;
    font-size: 0.85rem;
    text-align: center;
    padding: 40px 0;
  }

  .notice-banner {
    background: #fff4d6;
    color: #58080a;
    font-size: 0.8rem;
    text-align: center;
    padding: 8px 14px;
  }
</style>
</head>
<body>

<header id="site-header"></header>

<div class="notice-banner">This document is provided for on-screen viewing.</div>

<div class="viewer-toolbar">
  <h2 id="doc-title">Loading document&hellip;</h2>
  <div class="viewer-parts" id="viewer-parts"></div>
</div>

<div class="viewer-stage" id="viewer-stage">
  <p class="viewer-status" id="viewer-status">Loading document&hellip;</p>
</div>

<footer id="site-footer"></footer>

<script src="../js/script.js?v=2"></script>
<script>
  renderHeader("../", "training");
  renderFooter("../");

  // ?title=...&file=<path from site root>[&file=...]
  // PDFs open in the browser's own viewer; Word/PowerPoint files are rendered by
  // Microsoft's Office Online viewer, which needs the site to be publicly reachable.
  const params = new URLSearchParams(location.search);
  const files = params.getAll("file").filter(f => f && !f.includes(".."));
  const title = params.get("title") || "Document";

  const titleEl = document.getElementById("doc-title");
  const stage = document.getElementById("viewer-stage");
  const partsEl = document.getElementById("viewer-parts");

  function showStatus(text) {
    stage.innerHTML = "";
    const p = document.createElement("p");
    p.className = "viewer-status";
    p.textContent = text;
    stage.appendChild(p);
  }

  function show(index) {
    const file = files[index];
    const url = new URL("../" + file.split("/").map(encodeURIComponent).join("/"), location.href).href;
    const isPdf = /\.pdf$/i.test(file);
    const isLocal = !/^https?:$/.test(location.protocol) || /^(localhost|127\.|\[::1\])/.test(location.hostname);

    partsEl.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === index));

    if (!isPdf && isLocal) {
      showStatus("Word and PowerPoint files can only be previewed on the published website.");
      return;
    }
    const frame = document.createElement("iframe");
    frame.title = `${title} — part ${index + 1}`;
    frame.src = isPdf
      ? url + "#toolbar=0"
      : "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url);
    stage.innerHTML = "";
    stage.appendChild(frame);
  }

  titleEl.textContent = title;
  document.title = title + " | District Training Institute, Shimoga";

  if (!files.length) {
    titleEl.textContent = "Document not found";
    showStatus("The requested document could not be found.");
  } else {
    if (files.length > 1) {
      files.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.textContent = "Part " + (i + 1);
        btn.addEventListener("click", () => show(i));
        partsEl.appendChild(btn);
      });
    }
    show(0);
  }
</script>
</body>
</html>
